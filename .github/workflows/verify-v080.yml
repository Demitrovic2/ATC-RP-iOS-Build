name: Verify ATC RP iOS v0.8.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Extract v0.7 base and apply v0.8 patch
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf pack src && mkdir -p pack src
          unzip -q ATC-RP-iOS-v0.7.0-GITHUB-BUILD-PACK.zip -d pack
          unzip -q pack/ATC-RP-iOS-v0.7.0-GITHUB-BUILD-PACK/ci/ATC-RP-iOS-v0.7.0-build-source.zip -d src
          echo '' | base64 --decode | gunzip > /tmp/v080.patch
          (cd src/atc-rp && patch -p1 < /tmp/v080.patch)
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('src/atc-rp/src/downloads/DownloadManager.ts')
          s=p.read_text()
          s=s.replace("return ()=>this.listeners.delete(fn)","return ()=>{this.listeners.delete(fn);}")
          p.write_text(s)
          PYFIX
      - name: Generate CI visual assets
        shell: bash
        run: |
          set -euxo pipefail
          cd src/atc-rp
          mkdir -p assets/images ios/ATCRP/Assets.xcassets/AppIcon.appiconset
          printf '%s' '' | base64 --decode > /tmp/base.png
          sips -z 512 512 /tmp/base.png --out assets/images/atc-logo.png >/dev/null
          python3 - <<'PY2'
          from pathlib import Path
          import json,subprocess
          out=Path('ios/ATCRP/Assets.xcassets/AppIcon.appiconset')
          spec=[('iphone','20x20','2x',40),('iphone','20x20','3x',60),('iphone','29x29','2x',58),('iphone','29x29','3x',87),('iphone','40x40','2x',80),('iphone','40x40','3x',120),('iphone','60x60','2x',120),('iphone','60x60','3x',180),('ipad','20x20','1x',20),('ipad','20x20','2x',40),('ipad','29x29','1x',29),('ipad','29x29','2x',58),('ipad','40x40','1x',40),('ipad','40x40','2x',80),('ipad','76x76','1x',76),('ipad','76x76','2x',152),('ipad','83.5x83.5','2x',167),('ios-marketing','1024x1024','1x',1024)]
          images=[]
          for idiom,size,scale,px in spec:
              name=f'icon-{idiom}-{size.replace(".","_")}@{scale}.png'
              subprocess.run(['sips','-z',str(px),str(px),'/tmp/base.png','--out',str(out/name)],check=True,stdout=subprocess.DEVNULL)
              images.append({'idiom':idiom,'size':size,'scale':scale,'filename':name})
          (out/'Contents.json').write_text(json.dumps({'images':images,'info':{'author':'xcode','version':1}},indent=2))
          (out.parent/'Contents.json').write_text(json.dumps({'info':{'author':'xcode','version':1}},indent=2))
          PY2
      - name: Fix LaunchScreen
        shell: bash
        run: |
          cat > src/atc-rp/ios/ATCRP/LaunchScreen.storyboard <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
            version="3.0"
            toolsVersion="21507"
            targetRuntime="iOS.CocoaTouch"
            propertyAccessControl="none"
            useAutolayout="YES"
            launchScreen="YES"
            useTraitCollections="YES"
            useSafeAreas="YES"
            colorMatched="YES"
            initialViewController="01J-lp-oVM">
            <device id="retina6_12" orientation="portrait" appearance="light"/>
            <dependencies>
              <deployment identifier="iOS"/>
              <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
              <capability name="Safe area layout guides" minToolsVersion="9.0"/>
              <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
            </dependencies>
            <scenes>
              <scene sceneID="EHf-IW-A2E">
                <objects>
                  <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                    <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                      <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                      <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                      <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                    </view>
                  </viewController>
                  <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                </objects>
                <point key="canvasLocation" x="53" y="375"/>
              </scene>
            </scenes>
          </document>
          EOF

      - name: Source verification
        working-directory: src/atc-rp
        run: npm run verify:source
      - name: Install JS dependencies
        working-directory: src/atc-rp
        run: npm ci --no-audit --no-fund
      - name: TypeScript verification
        working-directory: src/atc-rp
        run: npm run typecheck
      - name: CocoaPods
        working-directory: src/atc-rp/ios
        run: pod install --repo-update
      - name: Xcode Release build
        working-directory: src/atc-rp
        run: xcodebuild -workspace ios/ATCRP.xcworkspace -scheme ATCRP -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Bundle and package IPA
        working-directory: src/atc-rp
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output "$APP_PATH/main.jsbundle" --assets-dest "$APP_PATH"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/ATCRP.app
          (cd build && zip -qry ATC-RP-iOS-v0.8.0-unsigned.ipa Payload)
          test -s build/ATC-RP-iOS-v0.8.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ATC-RP-iOS-v0.8.0-unsigned
          path: src/atc-rp/build/ATC-RP-iOS-v0.8.0-unsigned.ipa
          if-no-files-found: error
