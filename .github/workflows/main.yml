name: Build ATC RP iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Build IPA
        shell: bash
        run: |
          set -euxo pipefail

          unzip -q ATC-RP-iOS-v0.7.0-GITHUB-BUILD-PACK.zip -d pack

          unzip -q \
            pack/ATC-RP-iOS-v0.7.0-GITHUB-BUILD-PACK/ci/ATC-RP-iOS-v0.7.0-build-source.zip \
            -d src

          cd src/atc-rp

          npm ci --no-audit --no-fund

          cd ios
          pod install --repo-update
          cd ..

          xcodebuild \
            -workspace ios/ATCRP.xcworkspace \
            -scheme ATCRP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' | head -n 1)"

          test -n "$APP_PATH"

          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output "$APP_PATH/main.jsbundle" \
            --assets-dest "$APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/ATCRP.app

          cd build
          zip -qry ATC-RP-iOS-v0.7.0-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ATC-RP-iOS-v0.7.0-unsigned
          path: src/atc-rp/build/ATC-RP-iOS-v0.7.0-unsigned.ipa
